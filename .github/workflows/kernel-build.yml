name: Build and Release Kernel

on:
  push:
    branches: [ "main", "imx/lf-6.12.20", "pre-release*" ]
  pull_request:
    branches: [ "main", "imx/lf-6.12.20", "pre-release*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    
    permissions:
      contents: write

    container:
      image: fedora:43

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc \
            make \
            bison \
            flex \
            openssl-devel \
            elfutils-libelf-devel \
            bc \
            rsync \
            rpm-build \
            git \
            findutils \
            hostname \
            tar \
            xz \
            python3 \
            perl \
            openssl \
            dwarves \
            dpkg-dev \
            fakeroot \
            gh

      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Clone mwifiex driver
        run: |
          mkdir -p drivers/staging
          cd drivers/staging
          if [ ! -d "mwifiex" ]; then
            git clone https://github.com/nxp-imx/mwifiex
          fi

      - name: Configure Kernel
        run: |
          cp arch/arm64/configs/mecha_v8_defconfig .config

      - name: Build Kernel
        run: |
          make -j$(nproc)

      - name: Packaging as RPM
        run: |
          # Packaging the build into an RPM package
          # Ensure uncompressed kernel image is used
          make KBUILD_IMAGE=arch/arm64/boot/Image binrpm-pkg -j$(nproc)

      - name: Packaging as DEB
        run: |
          # Packaging the build into a Debian package
          # Ensure uncompressed kernel image is used
          make KBUILD_IMAGE=arch/arm64/boot/Image bindeb-pkg -j$(nproc)

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages
          path: |
            rpmbuild/RPMS/**/*.rpm
            rpmbuild/SRPMS/**/*.rpm
            ../*.deb
            ../*.changes
            ../*.buildinfo

      - name: Create/Update Rolling Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Delete existing tag and release if they exist
          gh release delete kernel-latest --yes || true
          git tag -d kernel-latest || true
          git push origin :refs/tags/kernel-latest || true
          
          # Create a new tag and release
          git tag kernel-latest
          git push origin kernel-latest
          
          gh release create kernel-latest \
            --title "Latest Kernel Build" \
            --notes "Automated build from branch: ${{ github.ref_name }} (commit: ${{ github.sha }})" \
            --prerelease \
            ./rpmbuild/RPMS/**/*.rpm \
            ../*.deb


